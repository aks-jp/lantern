name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...

  docker:
    runs-on: ubuntu-latest
    needs: test
    env:
      COMPOSE_FILE: compose.yml
      SEARXNG_URL: http://searxng.invalid
      LANTERN_VERSION: ci
    steps:
      - uses: actions/checkout@v5
      - name: Create MCP key
        run: |
          openssl rand -hex 32 > secrets/mcp_keys.txt
          chmod 644 secrets/mcp_keys.txt
      - name: Build and start
        run: docker compose up -d --build
      - name: Wait for healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' lantern)
            [ "$status" = healthy ] && exit 0
            sleep 1
          done
          docker compose logs
          exit 1
      - name: Check auth and a tool call
        run: |
          url=http://127.0.0.1:8090/mcp
          body='{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"web_search","arguments":{"query":"test"}}}'
          headers=(-H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream')
          code=$(curl -s -o /dev/null -w '%{http_code}' "$url" "${headers[@]}" -d "$body")
          [ "$code" = 401 ] || { echo "expected 401 without key, got $code"; exit 1; }
          # SearXNG is unreachable here, so the tool must report a tool error.
          curl -fsS "$url" "${headers[@]}" -H "Authorization: Bearer $(cat secrets/mcp_keys.txt)" -d "$body" \
            | tee /dev/stderr | grep -q '"isError":true'
          curl -fsS http://127.0.0.1:8090/healthz
      - name: Check hardening and image size
        run: |
          [ "$(docker inspect -f '{{.Config.User}}' lantern)" = nonroot:nonroot ]
          [ "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' lantern)" = true ]
          size=$(docker image inspect lantern:ci --format '{{.Size}}')
          echo "Image size: $((size / 1000000)) MB"
          [ "$size" -lt 20000000 ]
      - name: Logs must not contain the key
        run: |
          ! docker compose logs | grep -F "$(cat secrets/mcp_keys.txt)"
      - if: always()
        run: docker compose down
