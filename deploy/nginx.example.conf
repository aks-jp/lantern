# Example: expose Lantern via HTTPS. Lantern itself stays bound to 127.0.0.1.
# Only the MCP endpoint and /healthz are forwarded; everything else is 404.
# Always configure clients with the https:// URL: many HTTP clients drop the
# Authorization header when following a redirect.

server {
    listen 80;
    listen [::]:80;
    server_name mcp-search.example.com;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mcp-search.example.com;

    ssl_certificate     /etc/letsencrypt/live/mcp-search.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp-search.example.com/privkey.pem;

    client_max_body_size 1m;

    # Exact match: must equal MCP_PATH.
    location = /mcp {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        # Lantern rejects requests that reach a loopback listener with a
        # foreign Host header (DNS rebinding protection), so send the
        # upstream address as Host.
        proxy_set_header Host              $proxy_host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Authorization and X-API-Key are passed through unchanged by default.

        proxy_buffering    off;
        proxy_read_timeout 300s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $proxy_host;
    }

    location / {
        return 404;
    }
}
